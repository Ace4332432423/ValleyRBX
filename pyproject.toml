[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valleyrbx"
version = "1.0.0"
description = "Cinematic Linux Roblox Studio Runtime with Vinegar Kombucha Wine Handler"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Team" }
]
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
valleyrbx = "studio_strapper.app:main"

[tool.setuptools.packages.find]
where = ["src"]
